name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'core/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/scheduled-assets-update.yml'

jobs:
  check-assets:
    runs-on: ubuntu-latest
    permissions:
        contents: read
        actions: write
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-

      - name: Restore Wintun Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-wintun-

      - name: Check Assets Existence
        id: check-assets
        run: |
          [ -d 'resources' ] || mkdir resources
          LIST=('geoip.dat' 'geosite.dat')
          for FILE_NAME in "${LIST[@]}"
          do
            echo -e "Checking ${FILE_NAME}..."
            if [ -s "./resources/${FILE_NAME}" ]; then
              echo -e "${FILE_NAME} exists."
            else
              echo -e "${FILE_NAME} does not exist."
              echo "missing=true" >> $GITHUB_OUTPUT
              break
            fi
          done
          LIST=('amd64' 'x86' 'arm64')
          for ARCHITECTURE in "${LIST[@]}"
          do
            echo -e "Checking wintun.dll for ${ARCHITECTURE}..."
            if [ -s "./resources/wintun/bin/${ARCHITECTURE}/wintun.dll" ]; then
              echo -e "wintun.dll for ${ARCHITECTURE} exists."
            else
              echo -e "wintun.dll for ${ARCHITECTURE} is missing."
              echo "missing=true" >> $GITHUB_OUTPUT
              break
            fi
          done
          echo -e "Checking wintun/LICENSE.txt..."
          if [ -s "./resources/wintun/LICENSE.txt" ]; then
            echo -e "wintun/LICENSE.txt exists."
          else
            echo -e "wintun/LICENSE.txt is missing."
            echo "missing=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Asset Update Workflow if Assets Missing
        if: steps.check-assets.outputs.missing == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            // On pull_request events context.ref is refs/pull/N/merge, which is
            // not a valid ref for createWorkflowDispatch; dispatch on the PR's
            // base branch instead so missing assets still get populated for the
            // PR build. Other events keep using context.ref.
            const ref = context.eventName === 'pull_request'
              ? context.payload.pull_request.base.ref
              : context.ref;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'scheduled-assets-update.yml',
              ref
            });
            console.log('Triggered scheduled-assets-update.yml due to missing assets on branch:', ref);

      - name: Sleep for 90 seconds if Assets Missing
        if: steps.check-assets.outputs.missing == 'true'
        run: sleep 90

  build:
    needs: check-assets
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [windows, linux]
        goarch: [amd64]
      fail-fast: false

    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Show workflow information
        run: |
          echo "GOOS: $GOOS, GOARCH: $GOARCH"
          if [[ ${GOOS} == 'windows' ]]; then
            echo "ASSET_NAME=client-tui-win-amd64" >> $GITHUB_ENV
          else
            echo "ASSET_NAME=client-tui-linux-amd64" >> $GITHUB_ENV
          fi

      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-

      - name: Restore Wintun Cache
        if: matrix.goos == 'windows'
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-wintun-

      - name: Download Geodat if Cache Missed
        run: |
          [ -d 'resources' ] || mkdir resources
          if [ -s 'resources/geoip.dat' ] && [ -s 'resources/geosite.dat' ]; then
            echo "Geodat cache hit, no download needed."
            exit 0
          fi
          echo "Geodat cache missed, downloading Xray-linux-64.zip fallback..."
          curl -fL --retry 5 --retry-delay 3 -o /tmp/Xray-linux-64.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o -j /tmp/Xray-linux-64.zip geoip.dat geosite.dat -d resources/
          [ -s 'resources/geoip.dat' ] && [ -s 'resources/geosite.dat' ] \
            || { echo "Failed to extract geoip.dat/geosite.dat"; exit 1; }

      - name: Download Wintun if Cache Missed
        if: matrix.goos == 'windows'
        env:
          # Same pinned version/hash as scheduled-assets-update.yml.
          WINTUN_VERSION: 0.14.1
          WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
        run: |
          if [ -s 'resources/wintun/bin/amd64/wintun.dll' ] && [ -s 'resources/wintun/LICENSE.txt' ]; then
            echo "Wintun cache hit, no download needed."
            exit 0
          fi
          echo "Wintun cache missed, downloading wintun-${WINTUN_VERSION}.zip fallback..."
          curl -fL --retry 5 --retry-delay 3 -o /tmp/wintun.zip \
            "https://www.wintun.net/builds/wintun-${WINTUN_VERSION}.zip"
          echo "${WINTUN_SHA256}  /tmp/wintun.zip" | sha256sum -c -
          unzip -o /tmp/wintun.zip -d resources/
          [ -s 'resources/wintun/bin/amd64/wintun.dll' ] && [ -s 'resources/wintun/LICENSE.txt' ] \
            || { echo "Failed to extract wintun assets"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          check-latest: true

      - name: Build Xray
        working-directory: core
        run: |
          mkdir -p ../build_assets
          COMMID=$(git describe --always --dirty)
          if [[ ${GOOS} == 'windows' ]]; then
            echo 'Building Xray for Windows...'
            go build -mod=vendor -o ../build_assets/xray.exe -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          else
            echo 'Building Xray...'
            go build -mod=vendor -o ../build_assets/xray -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" -v ./main
          fi

      - name: Build client-tui
        run: |
          mkdir -p client-tui/kernel
          if [[ ${GOOS} == 'windows' ]]; then
            # kernel_embed_windows.go embeds client-tui/kernel/xray-h3-v9-win-amd64.exe
            cp build_assets/xray.exe client-tui/kernel/xray-h3-v9-win-amd64.exe
            TUI_OUT=../build_assets/client-tui-win-amd64.exe
          else
            # kernel_embed_linux.go embeds client-tui/kernel/xray-h3-v9
            cp build_assets/xray client-tui/kernel/xray-h3-v9
            TUI_OUT=../build_assets/client-tui-linux-amd64
          fi
          cd client-tui
          go build -mod=mod -o "${TUI_OUT}" .

      - name: Add additional assets into package
        run: |
          mv -f resources/geo* build_assets/
          if [[ ${GOOS} == 'windows' ]]; then
            echo 'Adding Wintun into packages'
            mv resources/wintun/bin/amd64/wintun.dll build_assets/
            mv resources/wintun/LICENSE.txt build_assets/LICENSE-Wintun
            echo 'Adding Windows no-console launcher scripts'
            cat > build_assets/xray_no_window.cmd <<'EOF'
          powershell.exe -ExecutionPolicy Bypass -File ".\xray_no_window.ps1"
          EOF
            cat > build_assets/xray_no_window.ps1 <<'EOF'
          Start-Process -FilePath ".\xray.exe" -ArgumentList "-config .\config.json" -WindowStyle Hidden
          EOF
            cat > build_assets/xray_no_window.vbs <<'EOF'
          CreateObject("Wscript.Shell").Run "xray.exe -config config.json",0
          EOF
          fi

      - name: Copy README.md & LICENSE
        run: |
          cp ${GITHUB_WORKSPACE}/README.md ./build_assets/README.md
          cp ${GITHUB_WORKSPACE}/LICENSE ./build_assets/LICENSE

      - name: Create ZIP archive
        if: github.event_name == 'release'
        shell: bash
        run: |
          pushd build_assets || exit 1
          touch -mt $(date +%Y01010000) *
          zip -9vr ../${{ env.ASSET_NAME }}.zip .
          popd || exit 1
          FILE=./${{ env.ASSET_NAME }}.zip
          DGST=$FILE.dgst
          for METHOD in {"md5","sha1","sha256","sha512"}
          do
            openssl dgst -$METHOD $FILE | sed 's/([^)]*)//g' >>$DGST
          done

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        if: github.event_name == 'release'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ env.ASSET_NAME }}.zip*
          tag: ${{ github.ref }}
          file_glob: true

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET_NAME }}
          path: |
            ./build_assets/*
